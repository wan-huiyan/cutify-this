name: Deploy site to Pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "plugins/sparkle-that-page/skills/sparkle-that-page/examples/**"
      - "docs/wiggle-that-diagram/final/**"
      - "plugins/cutify-that-tab/skills/cutify-that-tab/examples/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (landing pages + demo, module paths preserved)
        run: |
          set -euo pipefail
          ex="plugins/sparkle-that-page/skills/sparkle-that-page/examples"
          mkdir -p "_site/$ex" _site/site
          # Landing pages + their glue. sparkle-bridge.js resolves ../plugins/... from its own
          # URL, so site/ and plugins/ MUST stay siblings — mirror the repo layout, don't flatten.
          cp site/*.html site/*.js "_site/site/"
          # Canonical effect modules + stylesheet + the raw demo, referenced in place
          # (single source of truth — no duplication).
          cp "$ex"/*.js "$ex"/*.css "$ex/demo.html" "_site/$ex/"
          # wiggle-that-diagram demo films (self-contained HTML, one per film) → /wiggle/<film>.html
          mkdir -p _site/wiggle
          cp docs/wiggle-that-diagram/final/*.html _site/wiggle/
          # cutify-that-tab: the style gallery, the builder, the tab preview, every example SVG and the
          # moods/ subfolder (moods.html loads ../pixel_*.svg), paths preserved. styles.html links
          # ../references/styles.md, so the references ride along.
          tab="plugins/cutify-that-tab/skills/cutify-that-tab"
          mkdir -p "_site/$tab/examples" "_site/$tab/references"
          cp -R "$tab"/examples/. "_site/$tab/examples/"
          cp "$tab"/references/*.md "_site/$tab/references/"
          # Front door → the chooser; friendly /demo.html → the raw effects demo.
          printf '<!doctype html><meta charset="utf-8"><title>sparkle that page</title><meta http-equiv="refresh" content="0; url=./site/">\n' > _site/index.html
          printf '<!doctype html><meta charset="utf-8"><title>sparkle that page — demo</title><meta http-equiv="refresh" content="0; url=./%s/demo.html">\n' "$ex" > _site/demo.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
