<svg id="scene" class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A phone, three receipt cards checked against an expense policy, a manager's approval and an expense report">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e9b949"/></marker>
</defs>
<g id="world">
<rect x="-600" y="-400" width="2800" height="1700" fill="#121826"/>
<!-- faint grid -->
<path d="M0 100H1600M0 300H1600M0 500H1600M0 700H1600M200 0V900M600 0V900M1000 0V900M1400 0V900" stroke="#1a2233" stroke-width="2"/>

<!-- phone -->
<rect x="70" y="180" width="220" height="520" rx="32" fill="#1f2a3f" stroke="#3a4560" stroke-width="3"/>
<rect x="84" y="216" width="192" height="448" rx="14" fill="#0d1220"/>
<rect x="152" y="196" width="56" height="8" rx="4" fill="#3a4560"/>
<g id="ph-cam"><circle cx="180" cy="330" r="46" fill="none" stroke="#a8b0c0" stroke-width="5"/><circle cx="180" cy="330" r="18" fill="#a8b0c0"/><rect x="146" y="272" width="30" height="14" rx="4" fill="#a8b0c0"/></g>
<rect id="flash" x="84" y="216" width="192" height="448" rx="14" fill="#f3f1ea" style="opacity:0"/>
<g id="ph-thumbs"><rect x="104" y="430" width="48" height="62" rx="5" fill="#f3f1ea"/><rect x="156" y="430" width="48" height="62" rx="5" fill="#f3f1ea"/><rect x="208" y="430" width="48" height="62" rx="5" fill="#f3f1ea"/>
 <path d="M112 448h32M112 460h24M112 472h28M164 448h32M164 460h24M164 472h28M216 448h32M216 460h24M216 472h28" stroke="#121826" stroke-width="4"/></g>
<g id="ph-paid" style="opacity:0"><circle cx="180" cy="560" r="44" fill="#5fd08a"/><path d="M160 560l14 14 26-30" fill="none" stroke="#121826" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(180 630)"><g id="paid"><text data-b="6" text-anchor="middle" y="8" font-size="26" font-weight="700" style="fill:#5fd08a">Paid</text></g></g>

<!-- policy -->
<g id="policy" style="opacity:0">
 <rect x="420" y="96" width="560" height="130" rx="18" fill="#1a2233" stroke="#e9b949" stroke-width="3"/>
 <g transform="translate(560 176)"><circle r="28" fill="none" stroke="#e9b949" stroke-width="4"/><path d="M-14 10A16 16 0 0 1 14 10" fill="none" stroke="#e9b949" stroke-width="4"/><path d="M0 10L10 -10" stroke="#e9b949" stroke-width="4" stroke-linecap="round"/></g>
 <g transform="translate(700 176)"><path d="M-24 -14H8L24 0L8 14H-24Z" fill="none" stroke="#e9b949" stroke-width="4" stroke-linejoin="round"/><circle cx="-12" cy="0" r="4" fill="#e9b949"/></g>
 <g transform="translate(840 176)"><rect x="-26" y="-16" width="52" height="36" rx="6" fill="none" stroke="#e9b949" stroke-width="4"/><circle cy="2" r="10" fill="none" stroke="#e9b949" stroke-width="4"/><rect x="-10" y="-24" width="20" height="8" rx="2" fill="#e9b949"/></g>
</g>
<g id="policy-t"><text data-b="2" x="700" y="134" text-anchor="middle" font-size="28" font-weight="700" style="fill:#e9b949">Expense policy</text></g>
<path id="rule1" d="M560 206V300" fill="none" stroke="#e9b949" stroke-width="3" style="opacity:0"/>
<path id="rule2" d="M700 206V300" fill="none" stroke="#e9b949" stroke-width="3" style="opacity:0"/>
<path id="rule3" d="M840 206V300" fill="none" stroke="#e9b949" stroke-width="3" style="opacity:0"/>

<!-- receipt cards -->
<g id="c1" style="opacity:0"><rect x="420" y="300" width="420" height="110" rx="16" fill="#1a2233" stroke="#2a3346" stroke-width="3"/>
 <g transform="translate(476 355)"><rect x="-26" y="-6" width="52" height="22" rx="4" fill="none" stroke="#5cc8d6" stroke-width="4"/><rect x="-26" y="-20" width="20" height="14" rx="4" fill="#5cc8d6"/><path d="M-26 16v8M26 16v8" stroke="#5cc8d6" stroke-width="4"/></g></g>
<g id="c2" style="opacity:0"><rect x="420" y="450" width="420" height="110" rx="16" fill="#1a2233" stroke="#2a3346" stroke-width="3"/>
 <g transform="translate(476 505)"><path d="M-12 -24v20a6 6 0 0 0 12 0v-20M-6 -24v48M14 -24c-8 4-8 22 0 26v22" fill="none" stroke="#5cc8d6" stroke-width="4" stroke-linecap="round"/></g></g>
<g id="c3" style="opacity:0"><rect x="420" y="600" width="420" height="110" rx="16" fill="#1a2233" stroke="#2a3346" stroke-width="3"/>
 <g transform="translate(476 655)"><path d="M-28 8V-2L-18 -18H18L28 -2V8Z" fill="none" stroke="#5cc8d6" stroke-width="4" stroke-linejoin="round"/><circle cx="-14" cy="12" r="7" fill="#5cc8d6"/><circle cx="14" cy="12" r="7" fill="#5cc8d6"/></g></g>
<g id="cards-t">
 <text data-b="1" x="530" y="366" font-size="30" font-weight="600">Hotel</text><text data-b="1" x="810" y="366" text-anchor="end" font-size="30" font-weight="700">$180</text>
 <text data-b="1" x="530" y="516" font-size="30" font-weight="600">Dinner</text><text data-b="1" x="810" y="516" text-anchor="end" font-size="30" font-weight="700">$95</text>
 <text data-b="1" x="530" y="666" font-size="30" font-weight="600">Taxi</text><text data-b="1" x="810" y="666" text-anchor="end" font-size="30" font-weight="700">$40</text>
</g>
<!-- flying receipts (phone to card slots) -->
<g transform="translate(128 461)"><g id="fly1" style="opacity:0"><rect x="-24" y="-31" width="48" height="62" rx="5" fill="#f3f1ea"/></g></g>
<g transform="translate(180 461)"><g id="fly2" style="opacity:0"><rect x="-24" y="-31" width="48" height="62" rx="5" fill="#f3f1ea"/></g></g>
<g transform="translate(232 461)"><g id="fly3" style="opacity:0"><rect x="-24" y="-31" width="48" height="62" rx="5" fill="#f3f1ea"/></g></g>

<!-- verdicts -->
<circle id="d1" cx="876" cy="355" r="16" fill="#5fd08a" style="opacity:0"/>
<circle id="d2" cx="876" cy="505" r="16" fill="#f0b24a" style="opacity:0"/>
<circle id="d3" cx="876" cy="655" r="16" fill="#f07a6e" style="opacity:0"/>
<g id="r1"><text data-b="3" x="906" y="365" font-size="28" font-weight="600" style="fill:#5fd08a">Under the limit</text></g>
<g id="r2"><text data-b="3" x="906" y="515" font-size="28" font-weight="600" style="fill:#f0b24a">Over the $60 meal limit</text></g>
<g id="r3"><text data-b="3" x="906" y="665" font-size="28" font-weight="600" style="fill:#f07a6e">No photo</text></g>
<path id="back3" d="M420 690C330 760 300 720 290 690" fill="none" stroke="#f07a6e" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#ah)" style="opacity:0"/>

<!-- manager -->
<path id="to-mgr" d="M1222 505C1290 505 1290 430 1320 398" fill="none" stroke="#f0b24a" stroke-width="4" marker-end="url(#ah)" style="opacity:0"/>
<g id="mgr" style="opacity:0"><rect x="1250" y="200" width="300" height="190" rx="18" fill="#1a2233" stroke="#2a3346" stroke-width="3"/>
 <circle cx="1310" cy="260" r="30" fill="#5cc8d6"/><circle cx="1310" cy="250" r="12" fill="#121826"/><path d="M1290 280a20 16 0 0 1 40 0" fill="#121826"/>
 <path d="M1360 248h150M1360 272h110" stroke="#2a3346" stroke-width="10" stroke-linecap="round"/></g>
<g id="mgr-ok">
 <rect x="1272" y="306" width="150" height="40" rx="20" fill="#5fd08a"/>
 <text data-b="4" x="1347" y="334" text-anchor="middle" font-size="22" font-weight="700" style="fill:#121826">Approved</text>
 <text data-b="4" x="1272" y="378" font-size="20" font-style="italic" style="fill:#a8b0c0">Client dinner, 2 people</text>
</g>

<!-- report -->
<g id="rep" style="opacity:0"><rect x="1250" y="450" width="300" height="320" rx="18" fill="#f3f1ea"/>
 <rect x="1250" y="450" width="300" height="56" rx="18" fill="#e9b949"/><rect x="1250" y="486" width="300" height="20" fill="#e9b949"/>
 <path d="M1278 478h120" stroke="#121826" stroke-width="10" stroke-linecap="round"/></g>
<g transform="translate(0 0)"><g id="row1" style="opacity:0"><rect x="1278" y="530" width="244" height="44" rx="8" fill="#e3e6ea"/><circle cx="1302" cy="552" r="9" fill="#3f9d61"/><rect x="1322" y="546" width="110" height="12" rx="6" fill="#121826"/><rect x="1452" y="546" width="50" height="12" rx="6" fill="#121826"/></g></g>
<g transform="translate(0 0)"><g id="row2" style="opacity:0"><rect x="1278" y="586" width="244" height="44" rx="8" fill="#e3e6ea"/><circle cx="1302" cy="608" r="9" fill="#3f9d61"/><rect x="1322" y="602" width="90" height="12" rx="6" fill="#121826"/><rect x="1462" y="602" width="40" height="12" rx="6" fill="#121826"/></g></g>
<path id="to-rep" d="M1210 380C1230 420 1240 440 1250 470" fill="none" stroke="#5fd08a" stroke-width="4" marker-end="url(#ah)" style="opacity:0"/>
<g id="total"><path d="M1278 660H1522" stroke="#121826" stroke-width="3"/><text data-b="5" x="1400" y="712" text-anchor="middle" font-size="34" font-weight="700" style="fill:#121826">Total $275</text></g>

<!-- money back to the phone -->
<g transform="translate(1400 740)"><g id="coin" style="opacity:0"><circle r="30" fill="#e9b949"/><path d="M0 -16v32M9 -9c-4-5-18-5-18 2s18 4 18 11-14 7-18 2" fill="none" stroke="#121826" stroke-width="4" stroke-linecap="round"/></g></g>
</g>
</svg>
