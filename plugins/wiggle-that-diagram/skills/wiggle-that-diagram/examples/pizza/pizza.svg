<svg id="scene" class="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A phone, a pizza kitchen and a house joined by a road">
<g id="world">
<!-- ground and road -->
<rect x="-400" y="700" width="2400" height="400" fill="#f3e6d3"/>
<rect x="1060" y="708" width="560" height="34" rx="17" fill="#e6d3bb"/>
<path d="M1080 725H1600" stroke="#fff8ef" stroke-width="4" stroke-dasharray="18 16"/>

<!-- phone -->
<rect x="140" y="210" width="240" height="480" rx="36" fill="#3a2a24"/>
<rect x="156" y="250" width="208" height="400" rx="16" fill="#fffdf9"/>
<rect x="232" y="226" width="56" height="8" rx="4" fill="#5a463d"/>
<text data-b="1" x="260" y="290" text-anchor="middle" font-size="24" font-weight="700">Pizza app</text>
<g id="scr-home">
 <g transform="translate(260 385)">
  <circle r="54" fill="#f2c27a"/><circle r="44" fill="#e5533d"/>
  <circle cx="-16" cy="-12" r="11" fill="#fff4dc"/><circle cx="18" cy="-6" r="10" fill="#fff4dc"/><circle cx="-4" cy="18" r="11" fill="#fff4dc"/>
  <circle cx="20" cy="22" r="5" fill="#5bb36a"/><circle cx="-24" cy="10" r="5" fill="#5bb36a"/>
 </g>
 <text data-b="1" x="260" y="482" text-anchor="middle" font-size="26" font-weight="600">Margherita</text>
 <g transform="translate(260 548)"><g id="btn">
  <rect x="-72" y="-27" width="144" height="54" rx="27" fill="#e5533d"/>
  <text data-b="1" y="9" text-anchor="middle" font-size="24" font-weight="700" style="fill:#fff">Order</text>
 </g></g>
 <circle id="tap" cx="260" cy="548" r="30" fill="none" stroke="#3a2a24" stroke-width="4" style="opacity:0"/>
 <g transform="translate(260 616)"><g id="sent">
  <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#e3f1df"/>
  <path d="M-38 0l8 8 14-16" fill="none" stroke="#3f8f4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text data-b="1" x="14" y="8" text-anchor="middle" font-size="22" font-weight="700" style="fill:#2f6e3b">Sent</text>
 </g></g>
</g>
<g id="scr-map" style="opacity:0">
 <rect x="156" y="310" width="208" height="340" rx="0" fill="#e3f1df"/>
 <path d="M160 600H360M220 312V648M300 312V648" stroke="#f4faf1" stroke-width="7"/>
 <path id="mroute" d="M186 560L226 500L296 500L330 380" fill="none" stroke="#f2a541" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
 <g transform="translate(330 368)"><path d="M-16 0L0-16L16 0V18H-16Z" fill="#4bb3a5"/></g>
 <circle id="mdot" cx="186" cy="560" r="11" fill="#e5533d" stroke="#fff" stroke-width="4"/>
 <g id="eta"><rect x="168" y="592" width="184" height="46" rx="23" fill="#fff"/>
 <text data-b="4" x="260" y="623" text-anchor="middle" font-size="24" font-weight="700">6 min away</text></g>
</g>

<!-- the order flying to the kitchen -->
<g transform="translate(330 470)"><g id="tok" style="opacity:0">
 <rect x="-20" y="-26" width="40" height="52" rx="5" fill="#fff" stroke="#3a2a24" stroke-width="3"/>
 <path d="M-10-10H10M-10 0H10M-10 10H4" stroke="#3a2a24" stroke-width="3" stroke-linecap="round"/>
</g></g>

<!-- kitchen -->
<rect x="640" y="200" width="440" height="500" rx="22" fill="#fffdf9" stroke="#3a2a24" stroke-width="5"/>
<rect x="640" y="200" width="440" height="78" rx="22" fill="#e5533d"/>
<rect x="640" y="250" width="440" height="28" fill="#e5533d"/>
<path d="M640 278H1080" stroke="#3a2a24" stroke-width="5"/>
<text data-b="2" x="860" y="252" text-anchor="middle" font-size="34" font-weight="700" style="fill:#fff">Kitchen</text>
<path d="M690 312H1030" stroke="#8a7468" stroke-width="4" stroke-linecap="round"/>
<g transform="translate(860 312)"><g id="ticket">
 <path d="M-62 0H62V92L52 84L41 92L31 84L21 92L10 84L0 92L-10 84L-21 92L-31 84L-41 92L-52 84L-62 92Z" fill="#fff" stroke="#3a2a24" stroke-width="3"/>
 <text data-b="2" y="38" text-anchor="middle" font-size="26" font-weight="700">#42</text>
 <text data-b="2" y="68" text-anchor="middle" font-size="18" font-weight="500">Margherita</text>
</g></g>
<!-- counter, oven, shelf -->
<path d="M680 452H950" stroke="#8a7468" stroke-width="5" stroke-linecap="round"/>
<rect x="680" y="476" width="250" height="190" rx="16" fill="#5a463d"/>
<rect x="704" y="500" width="202" height="104" rx="10" fill="#2c201b"/>
<rect id="glow" x="704" y="500" width="202" height="104" rx="10" fill="#f2a541" style="opacity:0"/>
<text data-b="2" x="805" y="645" text-anchor="middle" font-size="22" font-weight="700" style="fill:#fff4dc">Oven</text>
<path d="M960 560H1060" stroke="#8a7468" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(750 426)"><g id="pz">
 <circle r="24" fill="#f2c27a"/><circle r="19" fill="#e5533d"/><circle cx="-6" cy="-5" r="5" fill="#fff4dc"/><circle cx="7" cy="4" r="5" fill="#fff4dc"/>
</g></g>
<g transform="translate(1010 558)"><g id="box" style="opacity:0">
 <rect x="-40" y="-26" width="80" height="26" rx="4" fill="#f2c27a" stroke="#3a2a24" stroke-width="3"/>
 <path d="M-40-17H40" stroke="#3a2a24" stroke-width="2"/>
</g></g>
<text id="ready" data-b="3" x="1010" y="516" text-anchor="middle" font-size="26" font-weight="700" style="fill:#3f8f4e">Ready</text>


<!-- house -->
<path d="M1340 480L1460 384L1580 480Z" fill="#4bb3a5" stroke="#3a2a24" stroke-width="5" stroke-linejoin="round"/>
<rect x="1360" y="476" width="200" height="224" fill="#fffdf9" stroke="#3a2a24" stroke-width="5"/>
<rect x="1384" y="512" width="44" height="40" rx="4" fill="#cfe7f0" stroke="#3a2a24" stroke-width="3"/>
<rect id="door" x="1470" y="600" width="58" height="100" rx="6" fill="#e5533d" stroke="#3a2a24" stroke-width="4"/>
<text data-b="4" x="1499" y="578" text-anchor="middle" font-size="20" font-weight="700">12 Elm St</text>
<g transform="translate(1499 700)"><g id="doorbox" style="opacity:0">
 <rect x="-40" y="-26" width="80" height="26" rx="4" fill="#f2c27a" stroke="#3a2a24" stroke-width="3"/>
 <path d="M-40-17H40" stroke="#3a2a24" stroke-width="2"/>
</g></g>
<g transform="translate(1420 340)"><g id="done">
 <rect x="-160" y="-30" width="320" height="60" rx="30" fill="#3f8f4e"/>
 <path d="M-134 0l9 9 16-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
 <text data-b="5" x="22" y="9" text-anchor="middle" font-size="26" font-weight="700" style="fill:#fff">Delivered in 25 min</text>
</g></g>
<!-- scooter -->
<g transform="translate(1150 724)"><g id="scoot">
 <circle cx="-34" cy="-16" r="16" fill="#3a2a24"/><circle cx="34" cy="-16" r="16" fill="#3a2a24"/>
 <circle cx="-34" cy="-16" r="6" fill="#fffdf9"/><circle cx="34" cy="-16" r="6" fill="#fffdf9"/>
 <path d="M-50-30H18L34-62H44L40-30" fill="none" stroke="#4bb3a5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M-30-30Q-6-44 18-30" fill="#4bb3a5"/>
 <rect x="-18" y="-84" width="22" height="46" rx="10" fill="#e5533d"/>
 <circle cx="-7" cy="-98" r="14" fill="#f2c27a"/><path d="M-22-100A15 15 0 0 1 8-100Z" fill="#3a2a24"/>
 <g id="rackbox" style="opacity:0"><rect x="-74" y="-60" width="56" height="24" rx="4" fill="#f2c27a" stroke="#3a2a24" stroke-width="3"/></g>
</g></g>
</g>
</svg>
