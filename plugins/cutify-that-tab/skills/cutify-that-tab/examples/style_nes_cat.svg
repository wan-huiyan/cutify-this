<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 1-cell near-black outline -->
  <rect x="3" y="3" width="2" height="1" fill="#1f2937"/>
  <rect x="11" y="3" width="2" height="1" fill="#1f2937"/>
  <rect x="3" y="4" width="3" height="1" fill="#1f2937"/>
  <rect x="10" y="4" width="3" height="1" fill="#1f2937"/>
  <rect x="3" y="5" width="10" height="1" fill="#1f2937"/>
  <rect x="2" y="6" width="12" height="7" fill="#1f2937"/>
  <rect x="3" y="13" width="10" height="1" fill="#1f2937"/>
  <!-- body (orange-400) -->
  <rect x="4" y="4" width="1" height="1" fill="#fb923c"/>
  <rect x="11" y="4" width="1" height="1" fill="#fb923c"/>
  <rect x="4" y="5" width="2" height="1" fill="#fb923c"/>
  <rect x="10" y="5" width="2" height="1" fill="#fb923c"/>
  <rect x="3" y="6" width="10" height="7" fill="#fb923c"/>
  <!-- tabby stripes (orange-500) -->
  <rect x="6" y="6" width="1" height="1" fill="#f97316"/>
  <rect x="9" y="6" width="1" height="1" fill="#f97316"/>
  <rect x="7" y="7" width="2" height="1" fill="#f97316"/>
  <!-- inner ears + blush (pink-400) -->
  <rect x="4" y="4" width="1" height="1" fill="#f472b6"/>
  <rect x="11" y="4" width="1" height="1" fill="#f472b6"/>
  <rect x="3" y="10" width="2" height="1" fill="#f472b6"/>
  <rect x="11" y="10" width="2" height="1" fill="#f472b6"/>
  <!-- eyes -->
  <rect x="4" y="8" width="2" height="2" fill="#1f2937"/>
  <rect x="10" y="8" width="2" height="2" fill="#1f2937"/>
  <rect x="7" y="10" width="2" height="1" fill="#1f2937"/>
  <!-- eye highlights -->
  <rect x="4" y="8" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="8" width="1" height="1" fill="#ffffff"/>
</svg>
