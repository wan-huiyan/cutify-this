<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- grey edge outside the cut line -->
  <rect x="4" y="2" width="1" height="1" fill="#d1d5db"/>
  <rect x="11" y="2" width="1" height="1" fill="#d1d5db"/>
  <rect x="3" y="3" width="3" height="1" fill="#d1d5db"/>
  <rect x="10" y="3" width="3" height="1" fill="#d1d5db"/>
  <rect x="2" y="4" width="12" height="7" fill="#d1d5db"/>
  <rect x="3" y="11" width="10" height="1" fill="#d1d5db"/>
  <rect x="4" y="12" width="8" height="1" fill="#d1d5db"/>
  <rect x="5" y="13" width="6" height="1" fill="#d1d5db"/>
  <!-- 1-cell white border following the silhouette -->
  <rect x="4" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="11" y="3" width="1" height="1" fill="#ffffff"/>
  <rect x="3" y="4" width="3" height="1" fill="#ffffff"/>
