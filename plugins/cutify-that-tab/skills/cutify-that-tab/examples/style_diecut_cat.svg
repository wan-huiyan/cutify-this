  <!-- cat (amber-400) -->
  <rect x="4" y="4" width="1" height="1" fill="#fbbf24"/>
  <rect x="11" y="4" width="1" height="1" fill="#fbbf24"/>
  <rect x="4" y="5" width="2" height="1" fill="#fbbf24"/>
  <rect x="10" y="5" width="2" height="1" fill="#fbbf24"/>
  <rect x="4" y="6" width="8" height="5" fill="#fbbf24"/>
  <rect x="5" y="11" width="6" height="1" fill="#fbbf24"/>
  <!-- eyes + mouth -->
  <rect x="5" y="8" width="1" height="2" fill="#1f2937"/>
  <rect x="10" y="8" width="1" height="2" fill="#1f2937"/>
  <rect x="7" y="10" width="2" height="1" fill="#1f2937"/>
  <!-- blush (red-400) -->
  <rect x="4" y="10" width="1" height="1" fill="#f87171"/>
