<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- screen: lightest green tile (4th colour) -->
  <rect x="1" y="1" width="14" height="14" rx="3" fill="#8cad28"/>
  <!-- outline (darkest) -->
  <rect x="3" y="3" width="2" height="1" fill="#214231"/>
  <rect x="11" y="3" width="2" height="1" fill="#214231"/>
  <rect x="3" y="4" width="3" height="1" fill="#214231"/>
  <rect x="10" y="4" width="3" height="1" fill="#214231"/>
  <rect x="3" y="5" width="10" height="1" fill="#214231"/>
  <rect x="2" y="6" width="12" height="7" fill="#214231"/>
  <rect x="3" y="13" width="10" height="1" fill="#214231"/>
  <!-- cat fill (mid green) -->
  <rect x="4" y="4" width="1" height="1" fill="#6c9421"/>
  <rect x="11" y="4" width="1" height="1" fill="#6c9421"/>
  <rect x="4" y="5" width="2" height="1" fill="#6c9421"/>
  <rect x="10" y="5" width="2" height="1" fill="#6c9421"/>
  <rect x="3" y="6" width="10" height="7" fill="#6c9421"/>
  <!-- shade: inner ears + cheeks -->
  <rect x="4" y="4" width="1" height="1" fill="#426b29"/>
  <rect x="11" y="4" width="1" height="1" fill="#426b29"/>
  <rect x="4" y="10" width="1" height="1" fill="#426b29"/>
  <rect x="11" y="10" width="1" height="1" fill="#426b29"/>
  <!-- eyes + mouth -->
  <rect x="5" y="8" width="1" height="2" fill="#214231"/>
  <rect x="10" y="8" width="1" height="2" fill="#214231"/>
  <rect x="7" y="10" width="2" height="1" fill="#214231"/>
</svg>
