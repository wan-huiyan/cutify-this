<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- axolotl asleep: ../pixel_axolotl.svg with the same body and palette; eyes closed (3-cell curves), a z. -->
  <!-- gills (pink-500) -->
  <rect x="2" y="5" width="2" height="2" fill="#ec4899"/>
  <rect x="12" y="5" width="2" height="2" fill="#ec4899"/>
  <rect x="3" y="4" width="1" height="1" fill="#ec4899"/>
  <rect x="12" y="4" width="1" height="1" fill="#ec4899"/>
  <!-- head -->
  <rect x="4" y="5" width="8" height="8" fill="#f9a8d4"/>
  <!-- closed eyes -->
  <rect x="4" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="6" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="7" width="1" height="1" fill="#1f2937"/>
  <!-- mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#1f2937"/>
  <!-- cheeks -->
  <rect x="4" y="10" width="1" height="1" fill="#ec4899"/>
  <rect x="11" y="10" width="1" height="1" fill="#ec4899"/>
  <!-- z, in the free air above the head -->
  <rect x="9" y="2" width="2" height="1" fill="#818cf8"/>
  <rect x="9" y="3" width="1" height="1" fill="#818cf8"/>
  <rect x="8" y="4" width="2" height="1" fill="#818cf8"/>
</svg>
