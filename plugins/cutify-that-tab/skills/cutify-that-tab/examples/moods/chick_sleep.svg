<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- chick asleep: ../pixel_chick.svg with the same body and palette; eyes closed (3-cell curves), a z. No free corner, so the z sits on the body. -->
  <!-- beak tip -->
  <rect x="7" y="2" width="2" height="1" fill="#facc15"/>
  <!-- body -->
  <rect x="3" y="3" width="10" height="10" fill="#fde047"/>
  <!-- closed eyes -->
  <rect x="4" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="6" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="6" width="1" height="1" fill="#1f2937"/>
  <!-- beak -->
  <rect x="7" y="8" width="2" height="1" fill="#f97316"/>
  <rect x="7" y="9" width="2" height="1" fill="#ea580c"/>
  <!-- cheeks -->
  <rect x="4" y="9" width="1" height="1" fill="#fb923c"/>
  <rect x="11" y="9" width="1" height="1" fill="#fb923c"/>
  <!-- feet -->
  <rect x="5" y="13" width="2" height="1" fill="#f97316"/>
  <rect x="9" y="13" width="2" height="1" fill="#f97316"/>
  <!-- z on the body (amber-600) -->
  <rect x="10" y="3" width="2" height="1" fill="#d97706"/>
  <rect x="10" y="4" width="1" height="1" fill="#d97706"/>
  <rect x="9" y="5" width="2" height="1" fill="#d97706"/>
</svg>
