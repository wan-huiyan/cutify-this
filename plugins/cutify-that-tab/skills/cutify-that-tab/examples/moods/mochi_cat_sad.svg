<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- mochi cat, sad: the error face. Worried brows, a tear, a frown. Same body as ../pixel_mochi_cat.svg. -->
  <!-- ears (pink-500) -->
  <rect x="3" y="3" width="2" height="2" fill="#ec4899"/>
  <rect x="11" y="3" width="2" height="2" fill="#ec4899"/>
  <!-- head (pink-300) -->
  <rect x="3" y="5" width="10" height="9" fill="#f9a8d4"/>
  <!-- worried brows: inner ends higher -->
  <rect x="4" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="6" width="1" height="1" fill="#1f2937"/>
  <!-- eyes -->
  <rect x="5" y="8" width="1" height="2" fill="#1f2937"/>
  <rect x="10" y="8" width="1" height="2" fill="#1f2937"/>
  <!-- tear (sky-400) -->
  <rect x="5" y="10" width="1" height="1" fill="#38bdf8"/>
  <!-- blush (pink-600) -->
  <rect x="4" y="10" width="1" height="1" fill="#db2777"/>
  <rect x="11" y="10" width="1" height="1" fill="#db2777"/>
  <!-- frown -->
  <rect x="7" y="11" width="2" height="1" fill="#1f2937"/>
  <rect x="6" y="12" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="12" width="1" height="1" fill="#1f2937"/>
</svg>
