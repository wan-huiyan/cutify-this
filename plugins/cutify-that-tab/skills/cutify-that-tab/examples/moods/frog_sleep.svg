<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- frog asleep: ../pixel_frog.svg with the same body and palette; eyes closed (3-cell curves), a z. The white eye blocks become green lids. -->
  <!-- eye bumps + lids (lime-500, the white is gone) -->
  <rect x="3" y="4" width="2" height="2" fill="#84cc16"/>
  <rect x="11" y="4" width="2" height="2" fill="#84cc16"/>
  <rect x="3" y="5" width="3" height="2" fill="#84cc16"/>
  <rect x="10" y="5" width="3" height="2" fill="#84cc16"/>
  <!-- closed eyes -->
  <rect x="3" y="5" width="1" height="1" fill="#1f2937"/>
  <rect x="4" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="5" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="5" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="6" width="1" height="1" fill="#1f2937"/>
  <rect x="12" y="5" width="1" height="1" fill="#1f2937"/>
  <!-- body -->
  <rect x="3" y="7" width="10" height="5" fill="#84cc16"/>
  <rect x="3" y="12" width="10" height="1" fill="#65a30d"/>
  <!-- mouth -->
  <rect x="6" y="10" width="4" height="1" fill="#1f2937"/>
  <!-- z, in the free air between the eyes -->
  <rect x="8" y="2" width="2" height="1" fill="#818cf8"/>
  <rect x="8" y="3" width="1" height="1" fill="#818cf8"/>
  <rect x="7" y="4" width="2" height="1" fill="#818cf8"/>
</svg>
