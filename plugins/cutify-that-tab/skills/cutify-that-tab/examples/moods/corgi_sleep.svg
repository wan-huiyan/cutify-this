<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- corgi asleep: ../pixel_corgi.svg with the same body and palette; eyes closed (3-cell curves), a z. No free corner, so the z sits on the forehead. -->
  <!-- ears -->
  <rect x="3" y="2" width="2" height="3" fill="#ea580c"/>
  <rect x="11" y="2" width="2" height="3" fill="#ea580c"/>
  <rect x="3" y="3" width="2" height="1" fill="#fef3c7"/>
  <rect x="11" y="3" width="2" height="1" fill="#fef3c7"/>
  <!-- head -->
  <rect x="3" y="4" width="10" height="9" fill="#fb923c"/>
  <!-- muzzle -->
  <rect x="5" y="8" width="6" height="5" fill="#fef3c7"/>
  <!-- closed eyes -->
  <rect x="4" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="6" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="7" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="7" width="1" height="1" fill="#1f2937"/>
  <!-- nose + tongue -->
  <rect x="7" y="9" width="2" height="1" fill="#1f2937"/>
  <rect x="7" y="11" width="2" height="1" fill="#ec4899"/>
  <!-- z on the forehead (muzzle cream) -->
  <rect x="8" y="4" width="2" height="1" fill="#fef3c7"/>
  <rect x="8" y="5" width="1" height="1" fill="#fef3c7"/>
  <rect x="7" y="6" width="2" height="1" fill="#fef3c7"/>
</svg>
