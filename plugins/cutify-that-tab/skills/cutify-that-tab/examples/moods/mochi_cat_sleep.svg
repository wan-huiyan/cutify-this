<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- mochi cat asleep: ../pixel_mochi_cat.svg with the same body and palette; eyes closed (3-cell curves), a z. -->
  <!-- ears (pink-500) -->
  <rect x="3" y="3" width="2" height="2" fill="#ec4899"/>
  <rect x="11" y="3" width="2" height="2" fill="#ec4899"/>
  <!-- head (pink-300) -->
  <rect x="3" y="5" width="10" height="9" fill="#f9a8d4"/>
  <!-- closed eyes -->
  <rect x="4" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="9" width="1" height="1" fill="#1f2937"/>
  <rect x="6" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="9" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="8" width="1" height="1" fill="#1f2937"/>
  <!-- blush (pink-600) -->
  <rect x="4" y="10" width="1" height="1" fill="#db2777"/>
  <rect x="11" y="10" width="1" height="1" fill="#db2777"/>
  <!-- mouth -->
  <rect x="7" y="10" width="1" height="1" fill="#1f2937"/>
  <rect x="8" y="10" width="1" height="1" fill="#1f2937"/>
  <!-- z, in the free air between the ears -->
  <rect x="8" y="2" width="2" height="1" fill="#818cf8"/>
  <rect x="8" y="3" width="1" height="1" fill="#818cf8"/>
  <rect x="7" y="4" width="2" height="1" fill="#818cf8"/>
</svg>
