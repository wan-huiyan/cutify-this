<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- bear asleep: ../pixel_bear.svg with the same body and palette; eyes closed (3-cell curves), a z. -->
  <!-- ears -->
  <rect x="3" y="3" width="2" height="2" fill="#92400e"/>
  <rect x="11" y="3" width="2" height="2" fill="#92400e"/>
  <rect x="4" y="4" width="1" height="1" fill="#f59e0b"/>
  <rect x="11" y="4" width="1" height="1" fill="#f59e0b"/>
  <!-- head -->
  <rect x="3" y="5" width="10" height="9" fill="#d97706"/>
  <!-- muzzle -->
  <rect x="6" y="10" width="4" height="3" fill="#fde68a"/>
  <!-- closed eyes -->
  <rect x="4" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="5" y="9" width="1" height="1" fill="#1f2937"/>
  <rect x="6" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="9" y="8" width="1" height="1" fill="#1f2937"/>
  <rect x="10" y="9" width="1" height="1" fill="#1f2937"/>
  <rect x="11" y="8" width="1" height="1" fill="#1f2937"/>
  <!-- nose + mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#1f2937"/>
  <rect x="7" y="12" width="1" height="1" fill="#92400e"/>
  <rect x="8" y="12" width="1" height="1" fill="#92400e"/>
  <!-- z, in the free air between the ears -->
  <rect x="8" y="2" width="2" height="1" fill="#818cf8"/>
  <rect x="8" y="3" width="1" height="1" fill="#818cf8"/>
  <rect x="7" y="4" width="2" height="1" fill="#818cf8"/>
</svg>
