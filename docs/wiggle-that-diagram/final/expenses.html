<style>:root{--ink:#f3f1ea;--muted:#a8b0c0;--line:#2a3346;--gold:#e9b949;--teal:#5cc8d6;--green:#5fd08a;--amber:#f0b24a;--red:#f07a6e;--card:#1a2233;--panel:#121826;--cap-ink:#e6e8ee;--on-gold:#1a1405}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel)}
body{color:var(--ink);font:16px/1.45 "Outfit",-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.anim{background:var(--panel)}
.stage{background:var(--panel)}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9}
.scene text{font-family:"Outfit",sans-serif;fill:var(--ink)}
.scene .t12{font-size:12px}.scene .t13{font-size:13px}.scene .t14{font-size:14px}.scene .t15{font-size:15px}.scene .b{font-weight:600}
.scene .m,.scene .m text{fill:var(--muted)}
.scene .fc{fill:var(--card)}.scene .fp{fill:var(--panel)}.scene .sl{stroke:var(--line);stroke-width:1.5}
.scene .dk{fill:var(--on-gold)}
.cap{display:grid;padding:14px 16px 12px;border-top:1px solid var(--line)}
.cap p{grid-area:1/1;margin:0;display:flex;gap:12px;align-items:flex-start;font-size:clamp(16px,calc(11px + .75vw),19px);line-height:1.45;color:var(--cap-ink);visibility:hidden;opacity:0;transition:opacity .45s}
.cap p.on{visibility:visible;opacity:1}
.cap .n{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:.82em;display:grid;place-items:center;margin-top:.14em}
.rail{display:flex;border-top:1px solid var(--line)}
.pp{flex:none;width:52px;min-height:48px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pp svg{width:14px;height:14px;fill:currentColor}
.steps{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;list-style:none;margin:0;padding:0}
.steps button{position:relative;width:100%;height:100%;min-height:48px;border:0;background:transparent;cursor:pointer;padding:8px 10px;font:500 14px/1.25 "Outfit",sans-serif;color:var(--muted);text-align:left;display:flex;gap:8px;align-items:center}
.steps b{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.steps i{position:absolute;left:0;top:-1px;height:3px;width:calc(var(--p,0)*100%);background:var(--gold)}
.steps button[aria-current=step]{color:var(--ink)}
.steps button[aria-current=step] b{background:var(--gold);color:var(--on-gold);box-shadow:none}
.steps button.done b{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold)}
.steps button:focus-visible,.pp:focus-visible{outline:2px solid var(--teal);outline-offset:-3px}
@media (max-width:820px){.steps .lab{display:none}.steps button{justify-content:center;padding:8px 2px}}
.rm .cap{display:block}
.rm .cap p{visibility:visible;opacity:.6;margin:0 0 10px;transition:none}
.rm .cap p.on{opacity:1}
.rm .cap p:last-child{margin-bottom:0}
</style>
</head>

tl.set("#to-mgr",{opacity:1},T(3,.4));draw("#to-mgr",3,.4,1.0);
tl.to("#mgr",{opacity:1,duration:.5},T(3,1.0));
R("#mgr-ok",3,2.5,{scale:.85});
/* beat 5: approved lines fill the report */
camTo(4,4,0);
tl.to("#rep",{opacity:1,duration:.5},T(4,.3));
tl.set("#to-rep",{opacity:1},T(4,.3));draw("#to-rep",4,.3,.8);
tl.fromTo("#row1",{opacity:0,x:-40},{opacity:1,x:0,duration:.5,ease:"sine.out"},T(4,1.0));
tl.fromTo("#row2",{opacity:0,x:-40},{opacity:1,x:0,duration:.5,ease:"sine.out"},T(4,1.5));
R("#total",4,2.5);
/* beat 6: pull back; the money travels back to Ana's phone */
camTo(5,5,0,2.0);
tl.to("#coin",{opacity:1,duration:.3},T(5,.6));
tl.to("#coin",{x:-1220,y:-180,duration:1.5,ease:"sine.inOut"},T(5,.8));
tl.to("#coin",{opacity:0,duration:.25},T(5,2.3));
tl.to("#ph-cam",{opacity:.25,duration:.4},T(5,2.2));
tl.fromTo("#ph-paid",{opacity:0,scale:.5,transformOrigin:"50% 50%"},{opacity:1,scale:1,duration:.45,ease:"back.out(2)"},T(5,2.3));
R("#paid",5,2.5);
/* loop: fade in at 0, hold the last frame, fade out over TAIL */
tl.fromTo("#world",{opacity:0},{opacity:1,duration:.5,ease:"none"},0);
tl.to("#world",{opacity:0,duration:TAIL,ease:"none"},END);
var cur=-1;
function stepAt(t){var k=0;for(var i=0;i<B.length;i++)if(t>=B[i]-1e-3)k=i;return k}
function tick(){applyCam();var t=tl.time(),k=stepAt(t);if(k!==cur){cur=k;mark(k)}
var p=Math.min(1,Math.max(0,(t-B[k])/BEATS[k].d));btns.forEach(function(b,i){b.style.setProperty("--p",i<k?1:i===k?p.toFixed(3):0)})}
var playing=false,started=false;
function icon(){pp.innerHTML=playing?'<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/></svg>':'<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1l10 6-10 6z"/></svg>';pp.setAttribute("aria-label",playing?"Pause animation":"Play animation")}
function play(){if(!started){started=true;tl.seek(0)}playing=true;tl.play();icon()}
function pause(){playing=false;tl.pause();icon()}
function still(i){tl.pause();tl.seek(B[i]+BEATS[i].still);tick()}
function show(i){started=true;playing=false;still(i);icon()}
pp.addEventListener("click",function(){playing?pause():play()});
btns.forEach(function(bt,i){bt.addEventListener("click",function(){if(playing){tl.seek(B[i]);tick()}else show(i)})});
window.addEventListener("message",function(e){if(e.source!==window.parent)return;var d=e.data;if(!d||typeof d!=="object")return;
if(d.type==="anim-play"){if(!reduce&&!playing)play()}else if(d.type==="anim-pause"){if(playing)pause()}});
window.__anim={time:function(){return tl.time()},playing:function(){return playing},seek:function(t){pause();started=true;tl.seek(t);tick()},B:B,END:END,TAIL:TAIL,REV:REV,beats:BEATS,tell:TELL,cam:function(){return svg.getAttribute("viewBox")}};
var ready=false;
function start(){ready=true;applyCam();if(playing){postH();return}
if(reduce)show(TELL);else if(embedded){still(0);icon()}else play();postH()}
if(window.ResizeObserver)new ResizeObserver(function(){applyCam();postH()}).observe(box);
icon();applyCam();
(D.fonts&&D.fonts.ready?D.fonts.ready:Promise.resolve()).then(start);
})();
</script>
<script>
(function(){ if (window.parent === window) return;
var send=function(m){ parent.postMessage(m,'*'); };
window.addEventListener('wheel',function(e){ e.preventDefault(); send({type:'deck-wheel',dy:e.deltaY,mode:e.deltaMode}); },{passive:false});
document.addEventListener('keydown',function(e){
var nav=['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','PageDown','PageUp','Home','End',' '];
if(nav.indexOf(e.key)<0) return;
if(e.key===' ' && e.target.closest && e.target.closest('button')) return;
e.preventDefault(); send({type:'deck-key',key:e.key}); });
var y0=null,x0=null;
window.addEventListener('touchstart',function(e){ if(e.touches.length===1){y0=e.touches[0].clientY;x0=e.touches[0].clientX;} },{passive:true});
window.addEventListener('touchend',function(e){ if(y0===null) return; var t=e.changedTouches[0];
send({type:'deck-swipe',dy:y0-t.clientY,dx:x0-t.clientX}); y0=null; },{passive:true});
})();
</script>
