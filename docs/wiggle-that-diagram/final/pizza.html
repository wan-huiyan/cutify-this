<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How a pizza order travels</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--ink:#f3f1ea;--muted:#a8b0c0;--line:#2a3346;--gold:#e9b949;--teal:#5cc8d6;--green:#5fd08a;--amber:#f0b24a;--red:#f07a6e;--card:#1a2233;--panel:#121826;--cap-ink:#e6e8ee;--on-gold:#1a1405}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel)}
body{color:var(--ink);font:16px/1.45 "Outfit",-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
.anim{background:var(--panel)}
.stage{background:var(--panel)}
.scene{display:block;width:100%;height:auto;aspect-ratio:16/9}
.scene text{font-family:"Outfit",sans-serif;fill:var(--ink)}
.scene .t12{font-size:12px}.scene .t13{font-size:13px}.scene .t14{font-size:14px}.scene .t15{font-size:15px}.scene .b{font-weight:600}
.scene .m,.scene .m text{fill:var(--muted)}
.scene .fc{fill:var(--card)}.scene .fp{fill:var(--panel)}.scene .sl{stroke:var(--line);stroke-width:1.5}
.scene .dk{fill:var(--on-gold)}
.cap{display:grid;padding:14px 16px 12px;border-top:1px solid var(--line)}
.cap p{grid-area:1/1;margin:0;display:flex;gap:12px;align-items:flex-start;font-size:clamp(16px,calc(11px + .75vw),19px);line-height:1.45;color:var(--cap-ink);visibility:hidden;opacity:0;transition:opacity .45s}
.cap p.on{visibility:visible;opacity:1}
.cap .n{flex:none;width:1.6em;height:1.6em;border-radius:50%;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:.82em;display:grid;place-items:center;margin-top:.14em}
.rail{display:flex;border-top:1px solid var(--line)}
.pp{flex:none;width:52px;min-height:48px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.pp svg{width:14px;height:14px;fill:currentColor}
.steps{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;list-style:none;margin:0;padding:0}
.steps button{position:relative;width:100%;height:100%;min-height:48px;border:0;background:transparent;cursor:pointer;padding:8px 10px;font:500 14px/1.25 "Outfit",sans-serif;color:var(--muted);text-align:left;display:flex;gap:8px;align-items:center}
.steps b{flex:none;width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.steps i{position:absolute;left:0;top:-1px;height:3px;width:calc(var(--p,0)*100%);background:var(--gold)}
.steps button[aria-current=step]{color:var(--ink)}
.steps button[aria-current=step] b{background:var(--gold);color:var(--on-gold);box-shadow:none}
.steps button.done b{box-shadow:inset 0 0 0 1.5px var(--gold);color:var(--gold)}
.steps button:focus-visible,.pp:focus-visible{outline:2px solid var(--teal);outline-offset:-3px}
@media (max-width:820px){.steps .lab{display:none}.steps button{justify-content:center;padding:8px 2px}}
.rm .cap{display:block}
.rm .cap p{visibility:visible;opacity:.6;margin:0 0 10px;transition:none}
.rm .cap p.on{opacity:1}
.rm .cap p:last-child{margin-bottom:0}
/* Cream-and-tomato theme for the pizza demo: redefines style C's :root tokens. */
:root{--ink:#3a2a24;--muted:#6f5a4f;--line:#ead9c6;--gold:#f2a541;--teal:#2f8f83;--green:#3f8f4e;--amber:#f2a541;--red:#e5533d;--card:#fffdf9;--panel:#fff8ef;--cap-ink:#3a2a24;--on-gold:#3a2a24}
</style>
</head>
<body>

</svg></div>
<div class="cap" id="cap"></div>
<div class="rail"><button class="pp" id="pp" type="button" aria-label="Play animation"></button><ol class="steps" id="steps" aria-label="Steps"></ol></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){"use strict";
var D=document,svg=D.getElementById("scene"),root=D.getElementById("anim");
var $=function(s){return svg.querySelector(s)},$$=function(s){return svg.querySelectorAll(s)};
var RED="#f07a6e",GRN="#5fd08a",AMB="#f0b24a",GOLD="#e9b949",TEAL="#5cc8d6";
var BEATS=[{"t": "Sam orders", "say": "Sam taps Order in the pizza app: one margherita, to 12 Elm Street.", "d": 7.0, "still": 6.4}, {"t": "Kitchen gets a ticket", "say": "The order prints as a ticket in the kitchen, and the pizza goes into the oven.", "d": 8.0, "still": 7.4}, {"t": "Driver collects", "say": "When the oven timer ends, the box goes on the shelf and a driver collects it.", "d": 8.0, "still": 7.4}, {"t": "Tracked on a map", "say": "The app follows the driver on a map, so Sam can watch the pizza get closer.", "d": 9.0, "still": 8.4}, {"t": "At the door", "say": "The driver hands over the box at 12 Elm Street, 25 minutes after the tap.", "d": 10.0, "still": 8.4}],TELL=4;
var B=[],END=0;BEATS.forEach(function(b){B.push(END);END+=b.d});var TAIL=.6;
var embedded=window.parent!==window;
var reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
/* captions + step rail */
var cap=D.getElementById("cap"),stepsEl=D.getElementById("steps"),pp=D.getElementById("pp"),caps=[],btns=[];
BEATS.forEach(function(b,i){
var p=D.createElement("p");p.innerHTML='<span class="n">'+(i+1)+'</span><span></span>';p.lastChild.textContent=b.say;cap.appendChild(p);caps.push(p);
var li=D.createElement("li"),bt=D.createElement("button");bt.type="button";bt.setAttribute("aria-label","Step "+(i+1)+": "+b.t);
bt.innerHTML='<i></i><b>'+(i+1)+'</b><span class="lab"></span>';bt.querySelector(".lab").textContent=b.t;li.appendChild(bt);stepsEl.appendChild(li);btns.push(bt);
});
/* height for the deck: the figure's own height, so it can shrink as well as grow */
var lastH=0;
function postH(){if(!embedded)return;var h=Math.ceil(root.getBoundingClientRect().height);if(h&&h!==lastH){lastH=h;parent.postMessage({type:"anim-height",h:h},"*")}}
if(window.ResizeObserver)new ResizeObserver(postH).observe(root);
window.addEventListener("resize",postH);window.addEventListener("load",postH);
if(reduce)root.classList.add("rm");
function mark(k){caps.forEach(function(p,i){p.classList.toggle("on",i===k)});btns.forEach(function(b,i){if(i===k)b.setAttribute("aria-current","step");else b.removeAttribute("aria-current");b.classList.toggle("done",i<k)})}
if(!window.gsap){root.classList.add("rm");mark(TELL);pp.hidden=true;postH();return}
/* virtual camera: frames are "must be visible" rects [cx,cy,w,h], fitted to the picture's aspect */
var cam={s:0},FR={},ORDER=[],mode="",box=svg.parentNode;
function layout(){var w=box.clientWidth;return w<560?"p":w<820?"m":"w"}
function frame(i){var f=FR[ORDER[Math.max(0,Math.min(ORDER.length-1,i))]];return mode==="w"?f.w:(f.t||f.w)}

if(!box.clientWidth||!ORDER.length)return;
var m=layout();if(m!==mode){mode=m;svg.style.aspectRatio=m==="p"?"4/5":m==="m"?"4/3":"16/9"}
var i=Math.floor(cam.s),f=cam.s-i,a=frame(i),b=frame(i+1),L=Math.log,r=m==="p"?.8:m==="m"?4/3:16/9;
/* fit each frame to the aspect first, then interpolate one width in log space: no kink mid-move */
var wa=Math.max(a[2],a[3]*r),wb=Math.max(b[2],b[3]*r);
var cx=a[0]+(b[0]-a[0])*f,cy=a[1]+(b[1]-a[1])*f,w=Math.exp(L(wa)+(L(wb)-L(wa))*f),h=w/r;

}
var tl=gsap.timeline({paused:true,repeat:-1,onUpdate:tick});
/* R = reveal; every text reveal is logged so the test page can check the 2.5 s spacing */
var REV=[];
function words(list){var n=0;[].forEach.call(list,function(el){var ts=el.tagName==="text"?[el]:[].slice.call(el.querySelectorAll("text")),own=el.closest(".why");
ts.forEach(function(t){if(!own&&t.closest(".why"))return;n+=t.textContent.split(/\s+/).filter(function(x){return /[A-Za-z0-9]/.test(x)}).length})});return n}

if(o.x!=null){f0.x=o.x;f1.x=0}else{f0.y=o.y==null?8:o.y;f1.y=0}
if(o.scale){f0.scale=o.scale;f1.scale=1;f0.transformOrigin=f1.transformOrigin="50% 50%"}
tl.fromTo(e,f0,f1,B[b]+off);REV.push({b:b,t:off,last:off+st*(e.length-1),w:words(e),s:String(s)})}
function camTo(i,b,off,dur,ease){tl.to(cam,{s:i,duration:dur||1.8,ease:ease||"sine.inOut"},B[b]+off)}
function T(b,off){return B[b]+off}
function draw(s,b,off,dur){var p=$(s),l=p.getTotalLength();tl.fromTo(p,{strokeDasharray:l,strokeDashoffset:l},{strokeDashoffset:0,duration:dur||1,ease:"power1.inOut"},B[b]+off)}
/* pizza: how an order travels from the app to the kitchen to the door. Beats are 0-based here (B[0] = beat 1); data-b in the SVG is 1-based. */
FR={
phone:  {w:[260,450,420,560],  t:[260,450,300,520]},
kitchen:{w:[860,430,520,480],  t:[860,440,460,470]},
pickup: {w:[1050,510,620,460], t:[1060,520,480,480]},
map:    {w:[850,460,1480,640], t:[300,450,320,520]},
door:   {w:[1430,530,540,460], t:[1400,530,460,500]},
all:    {w:[840,450,1540,660], t:[1250,520,760,560]}

ORDER=["phone","kitchen","pickup","map","door","all"];
/* beat 1: Sam taps Order */
tl.fromTo("#btn",{scale:1,transformOrigin:"50% 50%"},{scale:.92,duration:.18,yoyo:true,repeat:1,ease:"sine.inOut"},T(0,1.4));

/* beat 2: the order flies to the kitchen and prints as a ticket; the pizza goes in the oven */

tl.to("#tok",{opacity:0,duration:.3},T(1,2.3));
R("#ticket",1,3.0,{y:-18});

/* beat 3: timer ends, the box goes on the shelf, the driver takes it */
camTo(2,2,0);
tl.to("#glow",{opacity:0,duration:.6},T(2,.4));
tl.to("#pz",{x:260,y:120,duration:1.2,ease:"sine.inOut"},T(2,.8));
tl.to("#pz",{opacity:0,duration:.3},T(2,2.0));
tl.to("#box",{opacity:1,duration:.3},T(2,2.0));
R("#ready",2,3.0);
tl.to("#box",{x:94,y:131,duration:1.3,ease:"sine.inOut"},T(2,5.6));
tl.set("#box",{opacity:0},T(2,6.95));
tl.set("#rackbox",{opacity:1},T(2,6.95));
/* beat 4: the app follows the driver on a map */
camTo(3,3,0);
tl.to("#ready",{opacity:0,duration:.4},T(3,.2));
tl.to("#scr-home",{opacity:0,duration:.6},T(3,.4));
tl.to("#scr-map",{opacity:1,duration:.6},T(3,.4));
tl.to("#scoot",{x:170,duration:6.5,ease:"sine.inOut"},T(3,1.0));
tl.to("#mdot",{keyframes:[{x:40,y:-60},{x:110,y:-60},{x:144,y:-170}],duration:6.5,ease:"none"},T(3,1.0));
R("#eta",3,3.0);
/* beat 5: the box reaches the door; pull back to the whole trip (on narrow screens only to the road and the house, so the words stay readable) */
camTo(4,4,0,2.0);
tl.set("#rackbox",{opacity:0},T(4,1.0));
tl.set("#doorbox",{opacity:1},T(4,1.0));
tl.fromTo("#doorbox",{x:-225,y:-11},{x:0,y:0,duration:1.2,ease:"sine.inOut"},T(4,1.0));
R("#done",4,3.0,{y:12});
camTo(5,4,5.6,2.0);
/* loop: fade in at 0, hold the last frame, fade out over TAIL */
tl.fromTo("#world",{opacity:0},{opacity:1,duration:.5,ease:"none"},0);
tl.to("#world",{opacity:0,duration:TAIL,ease:"none"},END);
var cur=-1;
function stepAt(t){var k=0;for(var i=0;i<B.length;i++)if(t>=B[i]-1e-3)k=i;return k}
function tick(){applyCam();var t=tl.time(),k=stepAt(t);if(k!==cur){cur=k;mark(k)}
