<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How an expense claim gets checked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1420;--ink:#f3f1ea;--muted:#a8b0c0;--line:#2a3346;--gold:#e9b949;--teal:#5cc8d6;--green:#5fd08a;--amber:#f0b24a;--red:#f07a6e;--card:#1a2233;--panel:#121826}
*{box-sizing:border-box}
html,body{margin:0;background:#121826}
body{color:var(--ink);font-family:"Outfit",-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 0 14px}
.stage{position:relative;aspect-ratio:1/1;width:100%;background:var(--panel);overflow:hidden;cursor:pointer}
@media (min-width:660px){.wrap{padding-top:8px}.stage{border-radius:16px;box-shadow:0 0 0 1px var(--line)}}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage img{transition:opacity .25s}
.stage.ready img{opacity:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px 12px 0}
.pp{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;min-width:44px;padding:0 16px 0 14px;border:0;border-radius:999px;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--ink);font:600 15px/1 "Outfit",sans-serif;cursor:pointer}
.pp:hover{box-shadow:0 0 0 1px var(--gold)}
.pp svg{width:16px;height:16px;fill:currentColor}
.pp .lbl{min-width:3.1em;text-align:left}
.rail{flex:1;display:flex;gap:4px;min-width:0}
.rail button{flex:1;min-width:0;height:44px;border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font:600 13px/1 "Outfit",sans-serif;display:flex;flex-direction:column;justify-content:center;gap:7px}
.rail .n{display:block;text-align:left;padding-left:2px}
.rail .tr{display:block;position:relative;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.rail .tr i{position:absolute;inset:0;width:0;background:var(--gold)}
.rail button.done .tr i{width:100%;background:#6b6248}
.rail button[aria-current="step"]{color:var(--gold)}
.rail button:focus-visible,.pp:focus-visible,.list li button:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.cap{padding:12px 14px 2px;display:grid}
.cap .item{grid-area:1/1;visibility:hidden}
.cap .item.on{visibility:visible}
.cap .k{font-size:16px;font-weight:600;color:var(--gold);letter-spacing:.01em;line-height:1.3}
.cap p{margin:5px 0 0;font-size:17px;line-height:1.45;color:var(--ink)}
@media (min-width:560px){.cap p{font-size:18px}.cap .k{font-size:16px}}
.list{display:none;margin:0;padding:12px 14px 4px;list-style:none;counter-reset:s}
.list li{margin:0 0 6px}
.list li button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);font:400 17px/1.45 "Outfit",sans-serif;padding:8px 10px 8px 40px;position:relative;border-radius:10px;cursor:pointer}
.list li button::before{counter-increment:s;content:counter(s);position:absolute;left:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--ink);font:600 13px/22px "Outfit",sans-serif;text-align:center}
.list li button b{color:var(--ink);font-weight:600}
.list li button[aria-current="step"]{background:var(--card);color:var(--ink)}
.list li button[aria-current="step"]::before{background:var(--gold);color:#1a1405;box-shadow:none}
.rm .cap{display:none}
.rm .list{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

var embedded = window.parent !== window;
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var VERDICT = 3;
var v = document.getElementById('v'), stage = document.getElementById('stage'), pp = document.getElementById('pp'), ppl = document.getElementById('ppl'), ico = document.getElementById('ico');
var rail = document.getElementById('rail'), cap = document.getElementById('cap'), list = document.getElementById('list');
var N = BEATS.length, cur = -1, pending = reduce ? VERDICT - 1 : 0, playing = false;
if (reduce) document.getElementById('wrap').className += ' rm';

function post(){ if (!embedded) return; parent.postMessage({type:'anim-height', h: document.documentElement.scrollHeight}, '*'); }

var railBtns = [], items = [], listBtns = [];
BEATS.forEach(function(b, i){
  var r = document.createElement('button'); r.type = 'button';
  r.setAttribute('aria-label', 'Step ' + (i + 1) + ' of ' + N + ': ' + b.title);
  r.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="tr"><i></i></span>';
  r.addEventListener('click', function(){ jump(i); }); rail.appendChild(r); railBtns.push(r);
  var it = document.createElement('div'); it.className = 'item';
  it.innerHTML = '<div class="k">Step ' + (i + 1) + ' of ' + N + ' · ' + b.title + '</div><p></p>';
  it.querySelector('p').textContent = b.caption; cap.appendChild(it); items.push(it);
  var li = document.createElement('li'), lb = document.createElement('button'); lb.type = 'button';
  lb.innerHTML = '<b></b> <span></span>'; lb.querySelector('b').textContent = b.title + '.'; lb.querySelector('span').textContent = b.caption;
  lb.addEventListener('click', function(){ jump(i); }); li.appendChild(lb); list.appendChild(li); listBtns.push(lb);
});

function beatAt(t){ for (var i = N - 1; i >= 0; i--) if (t >= BEATS[i].t0 - 0.01) return i; return 0; }
function setBeat(i){
  if (i === cur) return; cur = i;
  for (var k = 0; k < N; k++) {
    var on = k === i;
    items[k].className = on ? 'item on' : 'item';
    if (on) { railBtns[k].setAttribute('aria-current', 'step'); listBtns[k].setAttribute('aria-current', 'step'); }
    else { railBtns[k].removeAttribute('aria-current'); listBtns[k].removeAttribute('aria-current'); }
    railBtns[k].className = k < i ? 'done' : '';
    if (k !== i) railBtns[k].querySelector('i').style.width = '';
  }
}
function fill(t){ var b = BEATS[cur]; if (!b) return; var p = Math.max(0, Math.min(1, (t - b.t0) / (b.t1 - b.t0))); railBtns[cur].querySelector('i').style.width = (p * 100).toFixed(1) + '%'; }

function ui(){ ppl.textContent = playing ? 'Pause' : 'Play'; pp.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
  ico.setAttribute('d', playing ? 'M3 1.5h3.6v13H3zM9.4 1.5H13v13H9.4z' : 'M3 1.5v13l11-6.5z'); }
function play(){
  if (pending !== null) { seek(BEATS[pending].t0); setBeat(pending); pending = null; }
  playing = true; ui(); stage.classList.add('ready');
  var p = v.play(); if (p && p.catch) p.catch(function(){ playing = false; ui(); });
}
function pause(){ playing = false; ui(); v.pause(); }
function jump(i){
  setBeat(i);
  if (playing) { pending = null; seek(BEATS[i].t0); }
  else { pending = i; seek(BEATS[i].still); fill(BEATS[i].still); }
}
pp.addEventListener('click', function(){ playing ? pause() : play(); });
stage.addEventListener('click', function(){ playing ? pause() : play(); });

(function loop(){ if (playing && !v.paused) { var t = v.currentTime; setBeat(beatAt(t)); fill(t); } requestAnimationFrame(loop); })();
v.addEventListener('seeked', function(){ stage.classList.add('ready'); });

// the video is inlined as base64 and handed to <video> as a Blob URL
var bin = atob(B64), u8 = new Uint8Array(bin.length); for (var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
v.src = URL.createObjectURL(new Blob([u8], {type: 'video/mp4'}));
setBeat(pending);
v.addEventListener('loadedmetadata', function(){
  if (!playing) { seek(BEATS[pending].still); fill(BEATS[pending].still); }
  post();
}, {once: true});
if (!embedded && !reduce) play();

window.addEventListener('message', function(e){
  var d = e.data; if (!d || typeof d !== 'object') return;
  if (d.type === 'anim-play') { if (!reduce) play(); }
  else if (d.type === 'anim-pause') pause();
});
window.addEventListener('load', post);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
if (window.ResizeObserver) new ResizeObserver(post).observe(document.body); else window.addEventListener('resize', post);
post();

<script>
(function(){ if (window.parent === window) return;
  var send=function(m){ parent.postMessage(m,'*'); };
  window.addEventListener('wheel',function(e){ e.preventDefault(); send({type:'deck-wheel',dy:e.deltaY,mode:e.deltaMode}); },{passive:false});
  document.addEventListener('keydown',function(e){
    var nav=['ArrowDown','ArrowUp','ArrowLeft','ArrowRight','PageDown','PageUp','Home','End',' '];
    if(nav.indexOf(e.key)<0) return;
    if(e.key===' ' && e.target.closest && e.target.closest('button')) return;
    e.preventDefault(); send({type:'deck-key',key:e.key}); });
  var y0=null,x0=null;
  window.addEventListener('touchstart',function(e){ if(e.touches.length===1){y0=e.touches[0].clientY;x0=e.touches[0].clientX;} },{passive:true});
  window.addEventListener('touchend',function(e){ if(y0===null) return; var t=e.changedTouches[0];
    send({type:'deck-swipe',dy:y0-t.clientY,dx:x0-t.clientX}); y0=null; },{passive:true});
})();
</script>
